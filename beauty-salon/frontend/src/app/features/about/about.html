<section class="section-padding section-gradient">
  <div class="section-grid--cols-2">
    <!-- ─── Imagen ─────────────────────────────────────── -->
    <div class="about-media">
      <img
        [src]="data().image"
        [alt]="data().imageAlt"
        loading="lazy"
        width="800"
        height="900"
        decoding="async"
      />
      <div class="about-media-accent" aria-hidden="true"></div>
    </div>

    <!-- ─── Contenido ──────────────────────────────────── -->
    <div class="about-content">
      <h2 class="about-title">{{ data().title }}</h2>
      <p class="about-subtitle">{{ data().subtitle }}</p>

      <p class="about-text">
        En <strong>{{ data().siteName }}</strong> {{ data().paragraphLead }}
      </p>
      <p class="about-text">{{ data().paragraphSecond }}</p>

      <!-- ─── Stats ────────────────────────────────────── -->
      <div class="about-stats">
        @for (stat of data().stats; track stat.label) {
          <div class="stat-card">
            <span class="stat-value">{{ stat.value }}</span>
            <span class="stat-label">{{ stat.label }}</span>
          </div>
        }
      </div>

      <!-- ─── CTA ──────────────────────────────────────── -->
      <app-cta-button
        [label]="data().ctaLabel"
        iconAfter="arrow-right"
        (clicked)="onCtaClick()"
      />
    </div>
  </div>
</section>
