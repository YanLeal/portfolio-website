<section class="section-padding">
  <div class="grid grid-cols-1 md:grid-cols-2 md:min-h-[500px] lg:min-h-[560px] max-w-[1200px] mx-auto">
    <!-- Imagen -->
    <div class="promo-media aspect-[3/4] md:aspect-auto">
      <img
        class="w-full h-full object-cover object-center"
        [src]="promo().image"
        [alt]="'Promoción ' + promo().month + ': ' + promo().service"
        width="800"
        height="1067"
        loading="lazy"
        decoding="async"
      />
    </div>

    <!-- Contenido -->
    <div class="flex flex-col justify-center p-8 md:p-12 lg:p-16 bg-neutral-50">
      <h2 class="sr-only">Promoción del {{ promo().month }}</h2>
      <div class="promo-entrance--slow promo-delay-1 flex flex-wrap items-center gap-x-2 gap-y-1 font-sans text-xs tracking-[0.15em] uppercase text-accent">
        <span>Promo • {{ promo().month }}</span>
        <span class="w-px h-3 bg-accent/30" aria-hidden="true"></span>
        <span>Válido hasta {{ promo().validUntil }}</span>
        <span class="inline-block w-2 h-2 rounded-full border border-accent/40 promo-shimmer" aria-hidden="true"></span>
      </div>

      <span class="promo-entrance--slow promo-delay-2 promo-float block font-heading text-5xl md:text-6xl lg:text-7xl font-bold text-primary leading-none mt-2">
        {{ promo().discount }}
      </span>

      <div class="promo-entrance--line promo-delay-3 w-10 h-px bg-accent-light mt-6 mb-6"></div>

      <h3 class="promo-entrance promo-delay-4 font-heading text-2xl md:text-3xl text-neutral-900">
        {{ promo().service }}
      </h3>

      <p class="promo-entrance--fade promo-delay-5 text-body text-neutral-600 leading-relaxed mt-2 max-w-prose">
        {{ promo().description }}
      </p>

      <div class="promo-entrance promo-delay-6 mt-8">
        <a
          [href]="whatsAppUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-primary"
        >
          {{ promo().ctaLabel }}
        </a>
      </div>

      @if (promo().spotsLeft > 0) {
        <p class="promo-entrance--fade promo-delay-7 text-sm text-neutral-500 mt-4">
          Quedan {{ promo().spotsLeft }} cupos
        </p>
      } @else {
        <p class="promo-entrance--fade promo-delay-7 text-sm text-neutral-500 mt-4">
          Promoción completa
        </p>
      }
    </div>
  </div>
</section>
