<section
  class="section-padding section-gradient"
  (mouseenter)="carousel.pause()"
  (mouseleave)="carousel.resume()"
  (focusin)="carousel.pause()"
  (focusout)="carousel.resume()"
  (keydown)="carousel.onKeydown($event)">
  <app-section-header [title]="testimonialsTitle()" [subtitle]="testimonialsSubtitle()" />
  @if (hasError()) {
    <app-error-boundary message="No pudimos cargar los testimonios. Actualiza la página o escríbenos por WhatsApp." />
  } @else if (!testimonials().length) {
    <app-empty-state
      [title]="noTestimonialsContent().title"
      [description]="noTestimonialsContent().description"
      icon="message-circle"
    />
  } @else {
    <app-carousel
      [controller]="carousel"
      [totalItems]="testimonials().length"
      ariaLabel="Testimonios de clientas"
      itemLabelSingular="testimonio"
      [hideNavOnBounds]="true">
      @for (item of testimonials(); track item.id; let i = $index) {
        <div
          class="carousel-slide"
          [class.carousel-slide--active]="i === carousel.currentIndex()"
          role="group"
          [attr.aria-roledescription]="'testimonio'"
          [attr.aria-label]="'Testimonio ' + (i + 1) + ' de ' + testimonials().length"
          [attr.aria-hidden]="i !== carousel.currentIndex()">
          <app-testimonial-card [name]="item.name" [photo]="item.photo" [text]="item.text" [rating]="item.rating" [service]="item.service" />
        </div>
      }
    </app-carousel>
  }
</section>
