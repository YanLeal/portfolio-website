<section id="faq">
  <app-section-header title="Preguntas frecuentes" subtitle="Todo lo que necesitas saber antes de tu visita" />

  <div class="buscador">
    <input
      type="search"
      placeholder="Busca tu pregunta…"
      [value]="searchText()"
      (input)="searchText.set($any($event.target).value)"
    />
  </div>

  <div class="filtros">
    <button type="button" (click)="seleccionar(null)" [class.active]="categoriaSeleccionada() === null">Todas</button>
    @for (cat of categorias(); track cat) {
      <button type="button" (click)="seleccionar(cat)" [class.active]="categoriaSeleccionada() === cat">{{ cat }}</button>
    }
  </div>

  @if (!hayResultados() && searchText()) {
    <app-empty-state
      [title]="noResultsContent().title"
      [description]="noResultsContent().description"
      icon="search"
    />
  }

  <div class="acordeon">
  @for (item of faqs(); track item.id) {
    <div
      appReveal
      class="faq-wrapper anim-hidden"
      [class.faq-hidden]="!coincideConFiltro(item)"
    >
      <app-faq-item [id]="item.id" [question]="item.question" [answer]="item.answer" [open]="faqAbierta() === item.id" (toggle)="toggleFaq(item.id)" />
    </div>
    }
  </div>
</section>
