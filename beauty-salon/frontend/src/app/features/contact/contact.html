<section class="section-container">
  <app-section-header title="Contacto" subtitle="Estamos para ayudarte" />

  <div class="contact-grid">
    <!-- ─── Formulario ──────────────────────────────────────── -->
    <div class="contact-form-wrap">
      @if (!submitted) {
        <form #appointmentForm="ngForm" (ngSubmit)="onSubmit()" class="contact-form" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Nombre <span class="required">*</span></label>
              <input
                id="name"
                name="name"
                type="text"
                [(ngModel)]="model.name"
                #nameCtrl="ngModel"
                required
                placeholder="Tu nombre"
                autocomplete="name"
                inputmode="text"
              />
            </div>

            <div class="form-group">
              <label for="phone">Celular <span class="required">*</span></label>
              <input
                id="phone"
                name="phone"
                type="tel"
                [(ngModel)]="model.phone"
                #phoneCtrl="ngModel"
                required
                placeholder="351 555-0123"
                autocomplete="tel"
                inputmode="numeric"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                [(ngModel)]="model.email"
                #emailCtrl="ngModel"
                placeholder="tucorreo@ejemplo.com"
                autocomplete="email"
                inputmode="email"
              />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="service">Servicio de interés <span class="required">*</span></label>
              <select
                id="service"
                name="service"
                [(ngModel)]="model.service"
                #serviceCtrl="ngModel"
                required
              >
                <option value="" disabled selected>Seleccioná un servicio</option>
                @for (s of services; track s.id) {
                  <option [value]="s.name">{{ s.name }}</option>
                }
              </select>
            </div>

            <div class="form-group">
              <label for="date">Fecha propuesta <span class="required">*</span></label>
              <input
                id="date"
                name="date"
                type="date"
                [(ngModel)]="model.date"
                #dateCtrl="ngModel"
                [min]="minDate"
                required
              />
            </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="appointmentForm.invalid">
            Solicitar turno
          </button>
        </form>
      }

      <!-- ─── Éxito ────────────────────────────────────────── -->
      @if (submitted) {
        <div class="form-success">
          <svg-icon name="check" size="48" />
          <h3>¡Solicitud enviada!</h3>
          <p>Te vamos a contactar pronto para confirmar el turno.</p>
          <button type="button" class="submit-btn submit-btn--outline" (click)="resetForm()">
            Nueva solicitud
          </button>
        </div>
      }
    </div>

    <!-- ─── Info de contacto ────────────────────────────────── -->
    <address class="contact-info">
      <div class="info-item">
        <svg-icon name="map-pin" size="20" />
        <div>
          <span class="info-label">Dirección</span>
          <span class="info-value">{{ address }}</span>
        </div>
      </div>
      <div class="info-item">
        <svg-icon name="phone" size="20" />
        <div>
          <span class="info-label">Teléfono</span>
          <a href="tel:+543515550123" class="info-value info-link">{{ phone }}</a>
        </div>
      </div>
      <div class="info-item">
        <svg-icon name="mail" size="20" />
        <div>
          <span class="info-label">Email</span>
          <a href="mailto:info@bellezaestilo.com" class="info-value info-link">{{ email }}</a>
        </div>
      </div>
      <div class="info-item">
        <svg-icon name="clock" size="20" />
        <div>
          <span class="info-label">Horarios</span>
          <span class="info-value">{{ schedule }}</span>
        </div>
      </div>
    </address>
  </div>
</section>
