<section id="equipo" class="section-padding section-gradient">
  <app-section-header [title]="teamTitle()" [subtitle]="teamSubtitle()" />
  @if (hasError()) {
    <app-error-boundary message="No pudimos cargar el equipo. Actualiza la página o escríbenos por WhatsApp." />
  } @else {
    <div class="section-grid stagger">
    @for (member of team(); track member.id) {
      <div class="card-tilt-wrapper" appCardTilt>
        <article class="card-lift team-card card-entrance">
          <div class="card-photo card-media-zoom">
            <img [src]="member.photo" [alt]="member.name" width="400" height="400" loading="lazy" decoding="async" />
            <div class="card-overlay">
              <div class="card-social">
                @if (member.social.instagram) {
                  <!-- TODO: add real Instagram link (currently uses # from content.ts) -->
                  <a [href]="member.social.instagram" class="social-link" aria-label="Instagram de {{ member.name }}">
                    <app-svg-icon name="instagram" size="20" />
                  </a>
                }
                @if (member.social.facebook) {
                  <!-- TODO: add real Facebook link (currently uses # from content.ts) -->
                  <a [href]="member.social.facebook" class="social-link" aria-label="Facebook de {{ member.name }}">
                    <app-svg-icon name="facebook" size="20" />
                  </a>
                }
                @if (member.social.whatsapp) {
                  <!-- TODO: add real WhatsApp link (currently uses # from content.ts) -->
                  <a [href]="member.social.whatsapp" class="social-link" aria-label="WhatsApp de {{ member.name }}">
                    <app-svg-icon name="whatsapp" size="20" />
                  </a>
                }
              </div>
            </div>
          </div>
          <div class="card-body">
            <h3>{{ member.name }}</h3>
            <p class="card-role">{{ member.role }}</p>
            <p class="card-experience">
              <app-svg-icon name="clock" size="14" />
              {{ member.experience }} de experiencia
            </p>
            <p class="card-bio">{{ member.bio }}</p>
          </div>
        </article>
      </div>
    }
  </div>
  }
</section>
