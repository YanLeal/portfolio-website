<section>
  <app-section-header title="Equipo" subtitle="Los profesionales que te van a atender" />
  <div class="team-grid">
    @for (member of team; track member.id) {
      <article class="team-card">
        <div class="card-photo">
          <img [src]="member.photo" [alt]="member.name" width="400" height="400" loading="lazy" />
          <div class="card-overlay">
            <div class="card-social">
              @if (member.social.instagram) {
                <a [href]="member.social.instagram" class="social-link" aria-label="Instagram de {{ member.name }}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></svg>
                </a>
              }
              @if (member.social.facebook) {
                <a [href]="member.social.facebook" class="social-link" aria-label="Facebook de {{ member.name }}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" /></svg>
                </a>
              }
              @if (member.social.whatsapp) {
                <a [href]="member.social.whatsapp" class="social-link" aria-label="WhatsApp de {{ member.name }}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" /></svg>
                </a>
              }
            </div>
          </div>
        </div>
        <div class="card-body">
          <h3>{{ member.name }}</h3>
          <p class="card-role">{{ member.role }}</p>
          <p class="card-experience">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
            {{ member.experience }} de experiencia
          </p>
          <p class="card-bio">{{ member.bio }}</p>
        </div>
      </article>
    }
  </div>
</section>
