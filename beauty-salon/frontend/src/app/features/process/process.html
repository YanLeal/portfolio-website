<section class="py-16 md:py-20 scroll-mt-20">
  <app-section-header
    title="Nuestro proceso"
    subtitle="Tu experiencia en 4 pasos"
  />

  <div class="space-y-12 md:space-y-20">
    @for (step of steps; track step.number) {
      <div
        class="process-row grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 lg:gap-16 items-center max-w-[1200px] mx-auto px-4 md:px-6 lg:px-8 group"
        [style.--step-index]="$index"
      >
        @if ($index % 2 === 0) {
          <!-- Imagen -->
          <div class="overflow-hidden rounded-lg">
            <img
              [src]="step.image"
              [alt]="'Paso ' + step.number + ': ' + step.title"
              width="800"
              height="600"
              class="w-full aspect-[4/3] object-cover transition-transform duration-500 ease-out group-hover:scale-105"
              loading="lazy"
              decoding="async"
            />
          </div>

          <!-- Contenido -->
          <div class="relative pl-8 md:pl-12 flex flex-col items-start gap-3">
            <!-- Línea vertical conectora -->
            <div class="process-line absolute left-0 top-0 bottom-4 w-px bg-neutral-200 transition-colors duration-500 group-hover:bg-primary-light"></div>
            <!-- Dot del timeline -->
            <div class="process-dot absolute left-[-0.375rem] top-24 md:top-28 w-3 h-3 rounded-full border-2 border-neutral-300 bg-surface transition-colors duration-500 group-hover:border-primary group-hover:bg-primary"></div>

            <svg-icon [name]="step.icon" size="40" class="text-primary transition-transform duration-300 ease-out group-hover:scale-110" />
            <span class="select-none text-[5rem] md:text-[7rem] leading-none font-heading font-bold text-neutral-100 transition-colors duration-500 group-hover:text-primary">
              {{ step.number }}
            </span>
            <h3 class="font-heading text-2xl md:text-3xl text-neutral-900 -mt-1">
              {{ step.title }}
            </h3>
            <p class="text-body text-neutral-600 leading-relaxed max-w-prose">
              {{ step.description }}
            </p>
          </div>
        } @else {
          <!-- Contenido -->
          <div class="relative pl-8 md:pl-12 flex flex-col items-start gap-3">
            <!-- Línea vertical conectora -->
            <div class="process-line absolute left-0 top-0 bottom-4 w-px bg-neutral-200 transition-colors duration-500 group-hover:bg-primary-light"></div>
            <!-- Dot del timeline -->
            <div class="process-dot absolute left-[-0.375rem] top-24 md:top-28 w-3 h-3 rounded-full border-2 border-neutral-300 bg-surface transition-colors duration-500 group-hover:border-primary group-hover:bg-primary"></div>

            <svg-icon [name]="step.icon" size="40" class="text-primary transition-transform duration-300 ease-out group-hover:scale-110" />
            <span class="select-none text-[5rem] md:text-[7rem] leading-none font-heading font-bold text-neutral-100 transition-colors duration-500 group-hover:text-primary">
              {{ step.number }}
            </span>
            <h3 class="font-heading text-2xl md:text-3xl text-neutral-900 -mt-1">
              {{ step.title }}
            </h3>
            <p class="text-body text-neutral-600 leading-relaxed max-w-prose">
              {{ step.description }}
            </p>
          </div>

          <!-- Imagen -->
          <div class="overflow-hidden rounded-lg">
            <img
              [src]="step.image"
              [alt]="'Paso ' + step.number + ': ' + step.title"
              width="800"
              height="600"
              class="w-full aspect-[4/3] object-cover transition-transform duration-500 ease-out group-hover:scale-105"
              loading="lazy"
              decoding="async"
            />
          </div>
        }
      </div>
    }
  </div>
</section>
