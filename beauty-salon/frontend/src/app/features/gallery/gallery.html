<section id="galeria" class="section-padding">
  <app-section-header [title]="galleryTitle()" [subtitle]="gallerySubtitle()" />
  @if (hasError()) {
    <app-error-boundary message="No pudimos cargar la galería. Actualiza la página o visítanos en Instagram." />
  } @else {
    <app-gallery-grid [images]="images()" />
  }
</section>
