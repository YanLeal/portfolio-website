<section
  class="section-padding section-gradient"
  (mouseenter)="carousel.pause()"
  (mouseleave)="carousel.resume()"
  (keydown)="onSectionKeydown($event)">
  <app-section-header title="Antes y Después" subtitle="Resultados reales de nuestros tratamientos" />
  @if (hasError()) {
    <app-error-boundary message="No pudimos cargar los resultados. Actualiza la página o escríbenos por WhatsApp." />
  } @else {
    <app-carousel
      [controller]="carousel"
      [totalItems]="results().length"
      ariaLabel="Resultados antes y después"
      itemLabelSingular="resultado"
      [animateTrack]="animateTrack()"
      [zoomActive]="isZoomActive()"
      [onDotClick]="onDotClick"
      [hideNavOnBounds]="true">
      @for (item of results(); track item.id; let i = $index) {
        <div
          class="ba-slide"
          role="group"
          [attr.aria-roledescription]="'resultado'"
          [attr.aria-label]="'Resultado ' + (i + 1) + ' de ' + results().length"
          [attr.aria-hidden]="i !== carousel.currentIndex()">

          <!-- Comparador before / after (genérico) -->
          <app-image-compare
            [beforeImage]="item.beforeImage"
            [afterImage]="item.afterImage"
            [alt]="item.title"
            [active]="i === carousel.currentIndex()"
            [resetKey]="carousel.currentIndex()"
            [loadingStrategy]="eagerIndices().has(i) ? 'eager' : 'lazy'"
            (swipe)="onSwipe($event)"
            (zoomChange)="onZoomChange($event)" />

          <!-- Título, descripción, categoría — dominio before-after -->
          <div class="ba-info">
            <h3 class="ba-title">{{ item.title }}</h3>
            <p class="ba-description">{{ item.description }}</p>
          </div>
        </div>
      }
    </app-carousel>
  }
</section>
