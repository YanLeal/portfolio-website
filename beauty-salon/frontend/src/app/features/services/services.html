<section id="servicios" class="section-padding section-gradient" style="scroll-margin-top: 5rem">
  <app-section-header [title]="servicesTitle()" [subtitle]="servicesSubtitle()" />
  @if (hasError()) {
    <p class="section-error">No pudimos cargar los servicios. Actualiza la página o escríbenos por WhatsApp.</p>
  } @else {
    <div class="section-grid stagger">
      @for (service of services(); track service.id) {
        <app-service-card [service]="service" (book)="onBook($event)" />
      }
    </div>

    <div class="services-wa-wrap">
      <app-whatsapp-btn variant="services" label="Consulta por WhatsApp" />
    </div>
  }
</section>
