<section id="servicios" class="section-padding" style="scroll-margin-top: 5rem">
  <app-section-header title="Servicios" subtitle="Todo lo que necesitás para mimarte" />
  <div class="section-grid">
    @for (service of services; track service.id) {
      <app-service-card [service]="service" (book)="onBook($event)" />
    }
  </div>

  <div class="services-wa-wrap">
    <app-whatsapp-btn variant="services" label="Consultá por WhatsApp" />
  </div>
</section>
