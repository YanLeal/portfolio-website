<section id="servicios" class="section-padding section-gradient">
  <app-section-header [title]="servicesTitle()" [subtitle]="servicesSubtitle()" />
  @if (hasError()) {
    <app-error-boundary message="No pudimos cargar los servicios. Actualiza la página o escríbenos por WhatsApp." />
  } @else {
    <div class="section-grid stagger">
      @for (service of services(); track service.id) {
        <app-service-card
          [id]="service.id"
          [name]="service.name"
          [description]="service.description"
          [price]="service.price"
          [duration]="service.duration"
          [icon]="service.icon"
          [image]="service.image"
          [badges]="service.badges ?? []"
          (book)="onBook($event)"
        />
      }
    </div>

    <div class="services-wa-wrap">
      <app-whatsapp-btn variant="services" label="Consulta por WhatsApp" [phone]="waPhone()" />
    </div>
  }
</section>
