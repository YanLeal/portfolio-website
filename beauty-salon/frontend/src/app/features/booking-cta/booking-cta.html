<section class="cta-section">
  <div class="cta-bg">
    <img
      src="images/booking-cta-1400x600.webp"
      alt=""
      width="1400"
      height="600"
      loading="lazy"
      decoding="async"
    />
  </div>
  <div class="cta-overlay"></div>
  <div class="cta-content">
    <h2>Reserva tu turno</h2>
    <p>Elige el día y horario que más te convenga y ven a mimarte.</p>
    <app-cta-button label="Pedir turno" (clicked)="onBook()" />
  </div>
</section>
