<!-- ─── Desktop: horizontal nav ─────────────────────────── -->
<nav
  class="desktop-nav"
  aria-label="Navegación principal"
>
  <ul>
    @for (item of items(); track item.fragment) {
      <li>
        <a
          class="nav-link"
          [href]="'#' + item.fragment"
          (click)="scrollTo($event, item.fragment)"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>

  <a
    class="cta-nav"
    [class.is-scrolled]="isScrolled()"
    [href]="'#' + 'contacto'"
    (click)="scrollTo($event, 'contacto')"
  >
    {{ ctaReservar() }}
  </a>
</nav>

<!-- ─── Mobile: overlay panel ──────────────────────────── -->
<div
  class="mobile-overlay"
  [class.is-open]="isOpen()"
  (click)="close()"
  (keydown.escape)="close()"
  [attr.aria-hidden]="!isOpen()"
>
  <div class="backdrop"></div>

  <div class="panel" (click)="$event.stopPropagation()" (keydown)="onPanelKeydown($event)" role="dialog" aria-label="Menú de navegación">
    <ul>
      @for (item of items(); track item.fragment) {
        <li>
          <a
            class="mobile-link"
            [href]="'#' + item.fragment"
            (click)="scrollTo($event, item.fragment)"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <a
      class="cta-mobile"
      [href]="'#' + 'contacto'"
      (click)="scrollTo($event, 'contacto')"
    >
    {{ ctaReservar() }}
  </a>
  </div>
</div>
