<header>
  <div class="header-inner">
    <a routerLink="/" class="logo" [attr.aria-label]="data().logoAriaLabel">{{ data().siteName }}</a>

    <app-nav
      [isOpen]="isMenuOpen()"
      [isScrolled]="isScrolled()"
      (navigated)="closeMenu()"
    />

    <button
      class="hamburger lg:hidden"
      [class.is-open]="isMenuOpen()"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? data().menuCloseLabel : data().menuOpenLabel"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
