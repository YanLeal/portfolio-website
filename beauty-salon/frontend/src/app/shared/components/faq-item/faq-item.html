<details [open]="open()" [attr.aria-expanded]="open()">
  <summary
    (click)="toggle.emit()"
    (keydown.enter)="$event.preventDefault(); toggle.emit()"
    (keydown.space)="$event.preventDefault(); toggle.emit()"
    role="button"
    [attr.aria-controls]="'faq-respuesta-' + id()">
    <span class="faq-icon">↓</span>
    {{ question() }}
  </summary>
  <p [id]="'faq-respuesta-' + id()">{{ answer() }}</p>
</details>
