<article class="card-base">
  <!-- Foto de fondo + overlay -->
  <div class="card-media card-media-zoom">
    <img
      [src]="photo()"
      [alt]="'Foto de testimonio de ' + name()"
      width="400"
      height="300"
      loading="lazy"
      decoding="async"
    />
    <div class="card-overlay"></div>
  </div>

  <!-- Contenido -->
  <div class="card-content">
    <!-- Estrellas -->
    <div class="card-stars" [attr.aria-label]="rating() + ' de 5 estrellas'">
      @for (star of [1,2,3,4,5]; track star) {
        <svg
          class="star"
          [class.star--filled]="star <= rating()"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
      }
    </div>

    <!-- Comentario -->
    <blockquote>
      <p>{{ text() }}</p>
    </blockquote>

    <!-- Separador -->
    <hr />

    <!-- Autor + servicio -->
    <div class="card-author">
      <div class="author-avatar">
        <img
          [src]="photo()"
          [alt]="'Avatar de ' + name()"
          width="44"
          height="44"
          loading="lazy"
          decoding="async"
        />
      </div>
      <div class="author-info">
        <strong>{{ name() }}</strong>
        <span class="service-label">
          <svg-icon name="tag" size="12" />
          {{ service() }}
        </span>
      </div>
    </div>
  </div>
</article>
