<article>
  <!-- Foto de fondo + overlay -->
  <div class="card-media">
    <img
      [src]="testimonial().photo"
      [alt]="'Foto de testimonio de ' + testimonial().name"
      width="400"
      height="300"
      loading="lazy"
    />
    <div class="card-overlay"></div>
  </div>

  <!-- Contenido -->
  <div class="card-content">
    <!-- Estrellas -->
    <div class="card-stars" [attr.aria-label]="testimonial().rating + ' de 5 estrellas'">
      @for (star of [1,2,3,4,5]; track star) {
        <svg
          class="star"
          [class.star--filled]="star <= testimonial().rating"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
      }
    </div>

    <!-- Comentario -->
    <blockquote>
      <p>{{ testimonial().text }}</p>
    </blockquote>

    <!-- Separador -->
    <hr />

    <!-- Autor + servicio -->
    <div class="card-author">
      <div class="author-avatar">
        <img
          [src]="testimonial().photo"
          [alt]="'Avatar de ' + testimonial().name"
          width="44"
          height="44"
          loading="lazy"
        />
      </div>
      <div class="author-info">
        <strong>{{ testimonial().name }}</strong>
        <span class="service-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" /><line x1="7" y1="7" x2="7.01" y2="7" /></svg>
          {{ testimonial().service }}
        </span>
      </div>
    </div>
  </div>
</article>
