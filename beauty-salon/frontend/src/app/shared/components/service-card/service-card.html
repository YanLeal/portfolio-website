<app-card variant="lift" [tiltEnabled]="true">
  <!-- ─── Imagen ─────────────────────────────────────────── -->
  <div class="card-media card-media-zoom">
    <img
      [src]="service().image"
      [alt]="service().name"
      loading="lazy"
      width="800"
      height="597"
      decoding="async"
    />
    <div class="card-overlay"></div>

    <!-- Icono decorativo sobre la imagen (desde service.icon) -->
    <span class="card-icon" aria-hidden="true">
      <svg-icon [name]="$any(service().icon)" size="20" stroke-width="1.5" />
    </span>
  </div>

  <!-- ─── Contenido ──────────────────────────────────────── -->
  <div class="card-body">
    <h3 class="card-title">{{ service().name }}</h3>
    <p class="card-desc">{{ service().description }}</p>

    <div class="card-meta">
      <span class="meta-duration">
        <svg-icon name="clock" size="15" stroke-width="1.5" />
        {{ service().duration }}
      </span>
      <span class="meta-price">${{ service().price.toLocaleString('es-AR') }}</span>
    </div>

    <button type="button" class="btn btn-primary card-btn" (click)="book.emit(service().id)">
      Reservar
      <svg-icon name="arrow-right" size="16" />
    </button>
  </div>
</app-card>
