<app-card variant="lift" [tiltEnabled]="true">
  <!-- ─── cardMedia: Imagen + badges + overlay ────────────── -->
  <div class="card-media card-media-zoom" cardMedia>
    <img
      [src]="image()"
      [alt]="name()"
      loading="lazy"
      width="800"
      height="597"
      decoding="async"
    />

    <!-- Badges sobre la imagen — solo si existen y no están vacíos -->
    @if (badges()?.length) {
      <div class="card-badges" aria-label="Etiquetas del servicio">
        @for (badge of badges(); track badge.id; let idx = $index) {
          <app-badge [badge]="badge" [style.--badge-delay]="idx * 0.08 + 's'" />
        }
      </div>
    }

    <div class="card-overlay"></div>

    <!-- Icono decorativo sobre la imagen (desde service.icon) -->
    <span class="card-icon" aria-hidden="true">
      <app-svg-icon [name]="$any(icon())" size="20" stroke-width="1.5" />
    </span>
  </div>

  <!-- ─── cardBody: Contenido de la card ──────────────────── -->
  <div cardBody>
    <h3 class="card-title">{{ name() }}</h3>
    <p class="card-desc">{{ description() }}</p>

    <div class="card-meta">
      <span class="meta-duration">
        <app-svg-icon name="clock" size="15" stroke-width="1.5" />
        {{ duration() }}
      </span>
      <span class="meta-price">{{ priceLabel() }}</span>
    </div>

    <button type="button" class="btn btn-primary card-btn" (click)="action.emit(id())">
      {{ buttonLabel() }}
      <app-svg-icon name="arrow-right" size="16" />
    </button>
  </div>
</app-card>
