<button type="button" class="service-option" (click)="selected.emit(value())">
  <span class="option-name">{{ name() }}</span>
  <span class="option-meta">
    <span class="option-duration">{{ duration() }}</span>
    @if (priceLabel()) {
      <span class="option-price">{{ priceLabel() }}</span>
    }
  </span>
</button>
